{% load static %}
<!DOCTYPE html>
<html lang="zh-hans">
<head>
    <meta charset="UTF-8">
    <title>登录 - 企业员工管理系统</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap.min.css' %}">
    <style>
        body { background: #2f3542; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { width: 360px; background: #fff; border-radius: 8px; padding: 34px 30px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
        .login-title { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #333; }
        .captcha-row { display: flex; }
        .captcha-row input { flex: 1; }
        .captcha-row img { height: 34px; width: 110px; margin-left: 8px; cursor: pointer; border-radius: 4px; border: 1px solid #ddd; }
        .error-msg { color: #d9534f; margin: 8px 0 0; text-align: center; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-title">企业员工管理系统</div>
    {% if error %}<div class="alert alert-danger" style="padding:8px 12px">{{ error }}</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" class="form-control" value="{{ username }}" placeholder="请输入用户名" required autofocus>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
        </div>
        <div class="form-group">
            <label>验证码</label>
            <div class="captcha-row">
                <input type="text" name="captcha" class="form-control" placeholder="输入右侧验证码" maxlength="4" required>
                <img src="/captcha/?t={% now 'U' %}" id="captchaImg" title="看不清？点击刷新" alt="验证码">
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
    <p class="error-msg"></p>
</div>
<script src="{% static 'plugins/jquery-3.6.0.min.js' %}"></script>
<script>
    // 点击验证码图片刷新（加随机参数绕过缓存）
    $('#captchaImg').on('click', function () {
        this.src = '/captcha/?t=' + new Date().getTime();
    });
</script>
</body>
</html>
