{% extends 'layout.html' %}
{% block title %}城市列表 - 企业员工管理系统{% endblock %}
{% block content %}
<div style="margin-bottom:10px">
    <a class="btn btn-success" href="/city/add/">
        <span class="glyphicon glyphicon-plus-sign"></span> 新建城市
    </a>
    <a class="btn btn-default" href="/upload/modal/form/">上传示例</a>
</div>

<div class="panel panel-default panel-hrms">
    <div class="panel-heading"><span class="glyphicon glyphicon-th-list"></span> 城市列表</div>
    <table class="table table-bordered table-hover">
        <thead>
        <tr>
            <th style="width:60px">ID</th>
            <th style="width:120px">Logo</th>
            <th>名称</th>
            <th>人口</th>
        </tr>
        </thead>
        <tbody>
        {% for obj in queryset %}
            <tr>
                <td>{{ obj.id }}</td>
                <td>
                    {% if obj.img %}
                        <img src="/media/{{ obj.img }}" style="height:70px;border-radius:4px;object-fit:cover" alt="{{ obj.name }}">
                    {% else %}
                        <span class="text-muted">无</span>
                    {% endif %}
                </td>
                <td>{{ obj.name }}</td>
                <td>{{ obj.count }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="4" style="text-align:center;color:#999">暂无城市，点右上角「新建城市」上传一条</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
