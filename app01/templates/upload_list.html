{% extends 'layout.html' %}
{% block title %}原始方式上传 - 企业员工管理系统{% endblock %}
{% block content %}
<div class="panel panel-default panel-hrms form-card">
    <div class="panel-heading"><span class="glyphicon glyphicon-open"></span> 原始方式上传</div>
    <div class="panel-body">
        <p class="help-block">
            表单三要素缺一不可：<code>method="post"</code>、<code>enctype="multipart/form-data"</code>、控件带 <code>name</code>。
            后端从 <code>request.FILES</code> 取文件，用 <code>chunks()</code> 分块写盘。
        </p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label class="control-label">用户名</label>
                <input type="text" name="username" class="form-control" placeholder="用户名">
            </div>
            <div class="form-group">
                <label class="control-label">选择文件</label>
                <input type="file" name="avatar">
            </div>
            <button type="submit" class="btn btn-primary">提 交</button>
            <a href="/upload/form/" class="btn btn-default">下一个示例</a>
        </form>
    </div>
</div>
{% endblock %}
